name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run publish + bundle steps in dry-run mode (no npm publish, no GitHub Release). Also skips downstream MCP Registry publish.'
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
      # attestations: write enables actions/attest-build-provenance to
      # generate a SLSA build provenance attestation for the .mcpb bundle.
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Extract package info
        id: pkg
        run: |
          NAME=$(node -e "console.log(require('./package.json').name)")
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "=== DRY RUN === $NAME@$VERSION will NOT be published"
          else
            echo "=== REAL PUBLISH === $NAME@$VERSION"
          fi

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" != "v${{ steps.pkg.outputs.version }}" ]; then
            echo "::error::Tag $TAG does not match package.json version v${{ steps.pkg.outputs.version }}"
            exit 1
          fi

      - name: Verify server.json version matches package.json
        run: |
          if [ ! -f server.json ]; then
            echo "::error::server.json not found at repo root"
            exit 1
          fi
          SERVER_VERSION=$(node -e "console.log(require('./server.json').version)")
          SERVER_NAME=$(node -e "console.log(require('./server.json').name)")
          PKG_MCP_NAME=$(node -e "console.log(require('./package.json').mcpName || '')")
          if [ "$SERVER_VERSION" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "::error::server.json version ($SERVER_VERSION) does not match package.json version (${{ steps.pkg.outputs.version }})"
            exit 1
          fi
          if [ "$SERVER_NAME" != "$PKG_MCP_NAME" ]; then
            echo "::error::server.json name ($SERVER_NAME) does not match package.json mcpName ($PKG_MCP_NAME)"
            exit 1
          fi
          echo "server.json verified: $SERVER_NAME@$SERVER_VERSION"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: npm publish --dry-run
        if: inputs.dry_run == true
        run: |
          echo "=== DRY RUN: no tarball will be uploaded to the registry ==="
          npm publish --provenance --access public --dry-run

      - name: npm publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --provenance --access public

      - name: Build Claude Desktop Extension (.mcpb)
        run: npm run bundle:mcpb

      # SLSA build provenance for the .mcpb bundle. Pinned to v4.1.0 by SHA;
      # bumped together via Dependabot's actions group.
      - name: Attest .mcpb build provenance
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: 'create-starter-${{ steps.pkg.outputs.version }}.mcpb'

      - name: Verify .mcpb bundle (dry-run)
        if: inputs.dry_run == true
        run: |
          BUNDLE="create-starter-${{ steps.pkg.outputs.version }}.mcpb"
          if [ ! -f "$BUNDLE" ]; then
            echo "::error::$BUNDLE was not produced"
            exit 1
          fi
          echo "Bundle: $BUNDLE ($(du -h "$BUNDLE" | cut -f1))"
          echo "=== manifest.json ==="
          unzip -p "$BUNDLE" manifest.json | head -40 || true
          echo "=== top-level entries ==="
          unzip -l "$BUNDLE" | head -25

      - name: Upload .mcpb as workflow artifact (dry-run)
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v7
        with:
          name: create-starter-${{ steps.pkg.outputs.version }}-dryrun-mcpb
          path: create-starter-${{ steps.pkg.outputs.version }}.mcpb
          retention-days: 7

      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: v${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          files: |
            create-starter-${{ steps.pkg.outputs.version }}.mcpb

      - name: Dry-run summary
        if: inputs.dry_run == true
        run: |
          {
            echo "## 🧪 Dry-run summary"
            echo ""
            echo "- **Package**: \`${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}\`"
            echo "- `npm publish` executed with `--dry-run` (no tarball uploaded)"
            echo "- GitHub Release **not** created"
            echo "- MCP Registry publish **not** triggered"
            echo "- `.mcpb` bundle built and attached below as a workflow artifact"
          } >> "$GITHUB_STEP_SUMMARY"
